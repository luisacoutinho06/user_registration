<div class="container mt-5">
  <h2>Usuários</h2>
  <a routerLink="/users/new" class="btn btn-success mb-3">Novo Usuário</a>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>Username</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.username }}</td>
        <td>
          <button class="btn btn-sm btn-primary me-1" (click)="editUser(user.id)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="deleteUser(user.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
