<div class="container my-5">
  <div class="card shadow-lg rounded-4 border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-4">
      <h2 class="mb-0 fw-bold fs-4">
        <i class="bi bi-people-fill me-2"></i> Usuários
      </h2>
      <a routerLink="/users/new" class="btn btn-light btn-sm d-flex align-items-center shadow-sm">
        <i class="bi bi-plus-circle me-2"></i> Novo Usuário
      </a>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Nome de Usuário</th>
              <th scope="col">E-mail</th>
              <th scope="col">Data Cadastro</th>
              <th scope="col">Tipo</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td>{{ user.id }}</td>
              <td class="fw-semibold">{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.registrationDate | date:'dd/MM/yyyy' }}</td>
              <td>
                <span class="badge rounded-pill px-3 py-2"
                  [ngClass]="{
                    'bg-primary': user.role === 1,
                    'bg-warning text-dark': user.role === 2,
                    'bg-secondary': user.role === 3
                  }">
                  {{ roleMap[user.role] }}
                </span>
              </td>
              <td>
                <button class="btn btn-outline-primary btn-sm me-2" (click)="editUser(user.id)">
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm" (click)="deleteUser(user.id)">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
