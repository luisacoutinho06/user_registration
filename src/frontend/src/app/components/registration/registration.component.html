<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4">Cadastros</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">Usuário</label>
        <input
          type="text"
          id="username"
          class="form-control"
          formControlName="username"
          placeholder="Digite seu usuário"
        />
        <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-danger small">
          Usuário é obrigatório
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input
          type="password"
          id="password"
          class="form-control"
          formControlName="password"
          placeholder="Digite sua senha"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small">
          Senha é obrigatória
        </div>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loginForm.invalid">
        Entrar
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">
        Esqueceu a senha? 
        <a href="#" class="text-decoration-none">Clique aqui</a>
      </small>
    </div>
  </div>
</div>
