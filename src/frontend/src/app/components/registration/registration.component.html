<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 1rem;">
    <h2 class="text-center mb-4 text-primary fw-bold">Cadastro de Usuário</h2>

    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label for="username" class="form-label">Nome de Usuário</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" id="username" class="form-control" formControlName="username"
            placeholder="Digite seu usuário" maxlength="20" />
        </div>
        <div *ngIf="registrationForm.get('username')?.touched && registrationForm.get('username')?.invalid"
          class="text-danger small mt-1">
          Nome de usuário é obrigatório
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
          <input type="email" id="email" class="form-control" formControlName="email" 
            placeholder="Digite seu e-mail" maxlength="60"/>
        </div>
        <div *ngIf="registrationForm.get('email')?.touched && registrationForm.get('email')?.invalid"
          class="text-danger small mt-1">
          E-mail válido é obrigatório
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control" 
            formControlName="password" placeholder="Digite sua senha" maxlength="16"/>
          <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
        <div
          *ngIf="registrationForm.get('password')?.touched && registrationForm.get('password')?.errors?.['strongPassword']"
          class="text-danger small mt-1">
          A senha deve ter no mínimo 8 caracteres, 1 letra maiúscula, 1 minúscula, 1 número e 1 caractere especial
        </div>
      </div>

      <div class="mb-4">
        <label for="passwordConfirmed" class="form-label">Confirme a Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input [type]="showPasswordConfirmed ? 'text' : 'password'" id="passwordConfirmed" class="form-control"
            formControlName="passwordConfirmed" placeholder="Repita sua senha" maxlength="16"/>
          <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordConfirmed()">
            <i class="bi" [ngClass]="showPasswordConfirmed ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
        <div
          *ngIf="registrationForm.get('passwordConfirmed')?.touched && registrationForm.get('passwordConfirmed')?.invalid"
          class="text-danger small mt-1">
          Confirmação de senha é obrigatória
        </div>
      </div>

      <button class="btn btn-primary w-100 mb-2 fw-bold" type="submit" [disabled]="registrationForm.invalid">
        <i class="bi bi-person-plus-fill me-2"></i> Cadastrar
      </button>
      <button class="btn btn-secondary w-100 fw-bold" type="button" [routerLink]="['/']">
        <i class="bi bi-arrow-left-circle-fill me-2"></i> Voltar para Login
      </button>
    </form>
  </div>
</div>
